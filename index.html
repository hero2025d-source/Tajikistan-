<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delta-177 · Field Shift</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root{--bg:#f6f7f4;--card:#fff;--ink:#1d2a24;--muted:#5f6f66;--acc:#2a9d8f;--acc2:#e9c46a;--bad:#d1495b;--line:#dfe5df}
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:#0f1f3d;color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px}
  header .logo{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#f4f1e8 0 30%,#1b2a5c 31%);border:3px solid #ffd166}
  header h1{font-size:20px;margin:0} header small{color:#b9c4dd}
  .wrap{display:grid;grid-template-columns:320px 1fr;gap:18px;padding:18px;max-width:1500px;margin:auto}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}}
  aside,.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  aside h3{font-size:15px;margin:16px 0 8px} aside h3:first-child{margin-top:0}
  label{display:block;font-size:14px;margin:4px 0} select,input[type=number],input[type=password]{width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .slider{display:grid;grid-template-columns:1fr auto;align-items:center;font-size:13px;gap:6px}
  .slider input{grid-column:1/3;width:100%}
  button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:15px;cursor:pointer}
  button.secondary{background:#e7efe9;color:var(--ink)} button:disabled{opacity:.5}
  #run{width:100%;margin-top:14px;font-weight:600}
  .note{background:#eef6f4;border-left:4px solid var(--acc);padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:12px}
  .warn{background:#fff4e0;border-left-color:#f2a541} .err{background:#fde8ea;border-left-color:var(--bad)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px} .tabs button{background:#e7efe9;color:var(--ink);font-size:14px;padding:8px 12px}
  .tabs button.on{background:var(--acc);color:#fff}
  .tab{display:none} .tab.on{display:block}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
  .card h4{margin:0 0 8px;font-size:16px} .bar{height:10px;background:#e7efe9;border-radius:6px;overflow:hidden;margin:6px 0}
  .bar div{height:100%;background:var(--acc)} .kpis{display:flex;gap:10px;margin:8px 0}
  .kpi{flex:1;background:#f3f6f3;border-radius:8px;padding:6px 8px;font-size:12px;color:var(--muted)} .kpi b{display:block;font-size:18px;color:var(--ink)}
  .card ul{padding-left:18px;margin:4px 0 8px;font-size:13.5px} .card p{font-size:13.5px;margin:4px 0}
  .best{border:2px solid var(--acc)} .badge{display:inline-block;background:var(--acc2);border-radius:6px;padding:2px 8px;font-size:12px;margin-bottom:6px}
  table.cal{border-collapse:collapse;width:100%;font-size:12px;margin-bottom:14px} table.cal td,table.cal th{border:1px solid var(--line);padding:5px;text-align:center}
  #mapcard{padding:0;overflow:hidden;margin-bottom:12px;position:relative}
  #map{height:440px;width:100%} #mapcard.big #map{height:78vh}
  .maptools{position:absolute;top:10px;left:56px;right:60px;z-index:1000;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
  .maptools>*{pointer-events:auto;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .datebox{background:#fff;border-radius:10px;padding:4px 10px;font-size:13px;display:flex;align-items:center;gap:6px}
  .datebox input{min-width:0!important;flex:none!important;padding:5px!important;font-size:13px!important;border:1px solid var(--line)!important}
  .maptools input{flex:1;min-width:180px;max-width:380px;padding:10px 12px;border:0;border-radius:10px;font-size:15px}
  .maptools button{background:#fff;color:var(--ink);padding:9px 12px;border-radius:10px;font-size:14px}
  .maptools button.go{background:var(--acc);color:#fff}
  .mapinfo{position:absolute;bottom:26px;left:10px;z-index:1000;background:rgba(15,31,61,.85);color:#fff;padding:7px 11px;border-radius:9px;font-size:13px}
  .pin{width:26px;height:26px;border-radius:50% 50% 50% 0;background:#d1495b;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
  .me{width:18px;height:18px;border-radius:50%;background:#2b7de9;border:3px solid #fff;box-shadow:0 0 0 6px rgba(43,125,233,.25)}
  #chat{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fbfcfb;margin:10px 0}
  .msg{margin:6px 0;padding:8px 10px;border-radius:10px;max-width:85%;white-space:pre-wrap;font-size:14px}
  .msg.user{background:#dff1ee;margin-left:auto} .msg.assistant{background:#f1f1ec}
  .chatrow{display:flex;gap:8px} .chatrow input{flex:1;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  .muted{color:var(--muted);font-size:13px} #status{min-height:22px}
  details{font-size:13px}
  header{justify-content:space-between;flex-wrap:wrap} header .hl{display:flex;align-items:center;gap:14px}
  header .hbtn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);font-size:14px;padding:8px 12px;margin-left:6px}
  .kpis4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px} @media(max-width:900px){.kpis4{grid-template-columns:1fr 1fr}}
  .kt{background:#0f1f3d;color:#f6f4ec;border-radius:12px;padding:14px 16px} .kt .v{font-size:28px;font-weight:700;color:#e9c46a;margin:4px 0}
  .kt .l{font-size:13px;color:#bfd0e4} .kt .s{font-size:12px;color:#bfd0e4}
  .scen{background:#fff4e0;border-radius:8px;padding:8px;font-size:13px;margin-top:6px}
  dl.gl dt{font-weight:600;margin-top:10px} dl.gl dd{margin:2px 0 0 0;font-size:14px;color:var(--muted)}
  @media print{aside,.tabs,.maptools,#mapcard,header .hbtn,#run,.chatrow,details summary{display:none!important}
    .wrap{display:block;padding:0} .tab{display:block!important;page-break-inside:avoid;margin-bottom:16px} .card{box-shadow:none}
    body{background:#fff} .cards{grid-template-columns:1fr 1fr}}
  /* ---------- simple mode ---------- */
  .simple{max-width:780px;margin:22px auto;padding:0 14px}
  .sq{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px 24px;box-shadow:0 6px 24px rgba(20,33,61,.07)}
  .sq h2{font-size:30px;margin:6px 0 14px;line-height:1.2} .sq .hint{color:var(--muted);font-size:17px;margin:0 0 10px}
  .dots{display:flex;gap:8px;margin-bottom:6px} .dots span{flex:1;height:8px;border-radius:5px;background:#e3e9e4} .dots span.on{background:var(--acc)}
  .stepno{color:var(--acc);font-weight:700;font-size:15px;letter-spacing:1px}
  .big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font-size:22px;padding:18px 20px;margin:10px 0;background:#eef6f4;color:var(--ink);border:2px solid transparent;border-radius:16px;cursor:pointer}
  .big:hover,.big:focus{border-color:var(--acc);outline:none} .big .em{font-size:32px;width:42px;text-align:center}
  .big small{display:block;font-size:15px;color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px} @media(max-width:600px){.grid2{grid-template-columns:1fr}}
  .navrow{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;flex-wrap:wrap}
  .link{background:none;color:var(--acc);padding:6px 0;font-size:17px;text-decoration:underline}
  .answer{background:#0f1f3d;color:#f6f4ec;border-radius:20px;padding:26px 24px}
  .answer .ok{font-size:18px;color:#e9c46a;font-weight:700;letter-spacing:1px} .answer h2{font-size:34px;margin:6px 0 18px;color:#fff}
  .fact{display:flex;gap:14px;align-items:flex-start;font-size:20px;line-height:1.4;margin:12px 0} .fact .em{font-size:28px;width:36px;text-align:center}
  .answer .why{background:#1a2d52;border-radius:14px;padding:14px 18px;margin-top:14px;font-size:16px;line-height:1.5}
  .bigbtn{font-size:19px;padding:14px 20px;border-radius:14px} .ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
  .spin{width:46px;height:46px;border:5px solid #e3e9e4;border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:18px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .langs{display:flex;gap:6px;justify-content:flex-end;margin-bottom:10px} .langs button{background:#e7efe9;color:var(--ink);font-size:15px;padding:7px 12px}
  .langs button.on{background:var(--acc);color:#fff}
  /* ---------- dashboard layout ---------- */
  .app{max-width:1500px;margin:auto;padding:18px}
  .top{display:grid;grid-template-columns:400px 1fr;gap:18px;align-items:start} @media(max-width:980px){.top{grid-template-columns:1fr}}
  aside.panel{padding:6px 18px 18px;position:sticky;top:10px} @media(max-width:980px){aside.panel{position:static}}
  .stepc{border-bottom:1px solid var(--line);padding:14px 0} .stepc:last-of-type{border-bottom:0}
  .sh{display:flex;align-items:center;gap:10px;margin-bottom:10px} .sh h3{margin:0!important;font-size:16px!important}
  .sn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
  .seg{display:flex;flex-wrap:wrap;gap:6px} .seg label{position:relative;margin:0;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:14px;background:#f8faf8}
  .seg.col label{width:100%} .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg label:has(input:checked){background:var(--acc);color:#fff;border-color:var(--acc)}
  .seg .cbox{width:100%} .seg .cbox input{position:static;opacity:1;pointer-events:auto}
  .cbox{background:#f3f7f4;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:4px}
  .crow{display:grid;grid-template-columns:52px 1fr 1fr;gap:6px;align-items:center;margin:6px 0;font-size:13px} .crow select,.crow input{padding:6px;font-size:13px;border:1px solid var(--line);border-radius:8px;min-width:0}
  #otherBox{display:flex;gap:6px} #otherBox input{flex:1 1 60%;min-width:120px!important} #otherBox select{width:auto;flex:0 1 40%} .crowhint{font-size:12px;color:var(--muted)}
  .chips{display:grid;grid-template-columns:1fr 1fr;gap:6px} .chips button{background:#f8faf8;color:var(--ink);border:1.5px solid var(--line);font-size:14px;padding:10px 8px;text-align:left}
  .chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .panel details summary{cursor:pointer;color:var(--acc);font-size:14px;margin-top:10px}
  .panel select{margin-top:2px} .sub{font-size:13px;color:var(--muted);margin:10px 0 4px}
  #map{height:380px}
  .answer{margin:12px 0} .answer h2{font-size:30px;margin:4px 0 10px} .answer .fact{font-size:18px;margin:8px 0}
  .hlang{display:inline-flex;gap:4px;margin-right:8px} .hlang button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);font-size:13px;padding:7px 10px}
  .hlang button.on{background:#e9c46a;color:#14213d;border-color:#e9c46a}
  .answer.empty{background:#e6eee7;color:var(--ink)} .answer.empty h2{color:var(--ink)}
</style>
</head>
<body>
<header><div class="hl"><div class="logo"></div><div><h1 id="t_title"></h1><small>Delta-177 · NASA Space Apps Challenge 2026 · Field Shift</small></div></div><div><span class="hlang" id="hlang"></span><button class="hbtn" id="shareBtn"></button><button class="hbtn" id="printBtn"></button></div></header>
<div class="app" id="full">
<div class="top">
<aside class="panel">
  <select id="lang" style="display:none"><option value="en" selected>English</option><option value="ru">Русский</option><option value="tj">Тоҷикӣ</option></select>
  <div class="stepc"><div class="sh"><span class="sn">1</span><h3 id="t_where"></h3></div>
    <select id="place"></select>
    <div class="row2" style="margin-top:6px"><input id="lat" type="number" step="0.01"><input id="lon" type="number" step="0.01"></div>
    <div class="muted" id="t_maphint" style="margin-top:6px"></div></div>
  <div class="stepc"><div class="sh"><span class="sn">2</span><h3 id="t_current"></h3></div>
    <div id="currentBox" class="seg col"></div>
    <p class="sub" id="t_prev"></p><select id="prev"></select>
    <input id="prevOther" style="display:none;margin-top:6px;width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;font-size:14px"></div>
  <div class="stepc"><div class="sh"><span class="sn">3</span><h3 id="t_water"></h3></div><div id="waterBox" class="seg"></div></div>
  <div class="stepc"><div class="sh"><span class="sn">4</span><h3 id="t_prio"></h3></div><div class="chips" id="goalBox"></div>
    <details><summary id="t_fine"></summary><div id="sliders" style="margin-top:8px"></div></details></div>
  <div class="stepc"><details><summary style="margin:0"><span class="sn" style="width:22px;height:22px;font-size:12px">5</span> <span id="t_scen"></span></summary>
    <div class="slider" style="margin-top:10px"><span id="t_srain"></span><b id="v_srain">0%</b><input type="range" min="-50" max="30" step="10" value="0" id="s_rain"></div>
    <div class="slider"><span id="t_stemp"></span><b id="v_stemp">+0 °C</b><input type="range" min="0" max="3" step="0.5" value="0" id="s_temp"></div></details>
    <div class="scen" id="scenNote" style="display:none"></div></div>
  <button id="run"></button>
</aside>
<div class="right">
  <div class="card" id="mapcard">
    <div class="maptools">
      <input id="search" autocomplete="off"><button class="go" id="searchBtn">🔍</button>
      <button id="locBtn"></button><label class="datebox" id="t_gibs" title=""><span id="t_gibslbl"></span> <input type="date" id="gibsDate"></label><button id="bigBtn">⛶</button>
    </div>
    <div id="map"></div>
    <div class="mapinfo" id="mapinfo"></div>
  </div>
  <div id="status"></div>
  <div id="answer"></div>
  <div class="kpis4" id="kpis"></div>
</div>
</div>
  <div class="note" id="t_disclaimer"></div>
  <div class="tabs" id="tabs"></div>
  <section class="tab on" id="tab_rec"><div id="bestLine" hidden></div><div class="cards" id="cards"></div>
    <p style="margin-top:12px"><button class="secondary" id="dl"></button></p></section>
  <section class="tab" id="tab_water"><div class="card"><div id="chWater" style="height:430px"></div></div></section>
  <section class="tab" id="tab_climate"><div class="card"><div id="chClimate" style="height:420px"></div></div>
    <div class="card" style="margin-top:12px"><h4 id="t_ndvi"></h4><p class="muted" id="ndviStatus"></p><div id="chNdvi" style="height:320px"></div><p id="ndviNote" style="font-size:14px"></p></div>
    <div class="cards" style="margin-top:12px"><div class="card"><div id="chRisk" style="height:320px"></div></div><div class="card"><div id="chSoil" style="height:320px"></div></div></div>
    <div class="card" style="margin-top:12px"><h4 id="t_trend"></h4><ul id="trends"></ul><div id="chTrend" style="height:280px"></div></div></section>
  <section class="tab" id="tab_cal"><div class="card"><p><b id="t_cal"></b></p><div id="calendars"></div></div></section>
  <section class="tab" id="tab_data"><div class="card" id="dataInfo"></div></section>
</div>

<script>
"use strict";
// ======================================================================= i18n

const PARAMS=["T2M","T2M_MAX","T2M_MIN","PRECTOTCORR","GWETROOT","ALLSKY_SFC_SW_DWN"];
const doyOf=(y,m,d)=>Math.round((Date.UTC(y,m-1,d)-Date.UTC(y,0,1))/864e5)+1;
async function fetchPower(lat,lon){
  const ck=`fs_power_${lat.toFixed(3)}_${lon.toFixed(3)}`;
  try{const c=localStorage.getItem(ck); if(c) return JSON.parse(c);}catch(e){}
  const url=`https://power.larc.nasa.gov/api/temporal/daily/point?parameters=${PARAMS.join(",")}&community=AG&latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&start=20010101&end=20241231&format=JSON`;
  const r=await fetch(url); if(!r.ok) throw new Error("HTTP "+r.status);
  const p=(await r.json()).properties.parameter;
  const rows=Object.keys(p.T2M).sort().map(k=>{const y=+k.slice(0,4),m=+k.slice(4,6),d=+k.slice(6,8);const o={y,m,d,doy:doyOf(y,m,d)};
    for(const P of PARAMS){const v=p[P][k];o[P]=(v==null||v<=-998)?NaN:v;}return o;});
  try{localStorage.setItem(ck,JSON.stringify(rows));}catch(e){}
  return rows;
}
function demoDaily(){ // synthetic valley climate, ONLY for offline testing
  let s=177; const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const norm=()=>Math.sqrt(-2*Math.log(rnd()+1e-12))*Math.cos(2*Math.PI*rnd());
  const rows=[];
  for(let y=2001;y<=2024;y++)for(let m=1;m<=12;m++){const dim=new Date(Date.UTC(y,m,0)).getUTCDate();for(let d=1;d<=dim;d++){
    const doy=doyOf(y,m,d),yi=y-2001,season=-Math.cos(2*Math.PI*(doy-15)/365);
    const t=16+15*season+0.04*yi+2.5*norm(),amp=7+(season+1);
    const wet=Math.max(0,0.6*Math.cos(2*Math.PI*(doy-70)/365))*(1-0.006*yi);
    const rain=rnd()<wet*0.35?-9.6*Math.log(rnd()+1e-9):0;
    rows.push({y,m,d,doy,T2M:t,T2M_MAX:t+amp,T2M_MIN:t-amp,PRECTOTCORR:rain,
      GWETROOT:Math.min(1,Math.max(.05,.45+.25*Math.cos(2*Math.PI*(doy-60)/365)-.003*yi+.03*norm())),ALLSKY_SFC_SW_DWN:15+10*season+2*norm()});}}
  return rows;
}
function addEto(rows,lat){ // Hargreaves–Samani, FAO-56 eq. 52
  const phi=lat*Math.PI/180;
  for(const r of rows){const j=r.doy,dr=1+.033*Math.cos(2*Math.PI*j/365),dec=.409*Math.sin(2*Math.PI*j/365-1.39);
    const ws=Math.acos(Math.max(-1,Math.min(1,-Math.tan(phi)*Math.tan(dec))));
    const ra=(24*60/Math.PI)*.082*dr*(ws*Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.sin(ws));
    const tr=Math.max(0,r.T2M_MAX-r.T2M_MIN); r.ETO=Math.max(0,.0023*.408*ra*(r.T2M+17.8)*Math.sqrt(tr));}
  return rows;
}
const mean=a=>{const b=a.filter(Number.isFinite);return b.length?b.reduce((x,y)=>x+y,0)/b.length:NaN;};
const sum=a=>a.filter(Number.isFinite).reduce((x,y)=>x+y,0);
const median=a=>{const b=a.filter(Number.isFinite).sort((x,y)=>x-y);if(!b.length)return NaN;const h=b.length/2;return b.length%2?b[h|0]:(b[h-1]+b[h])/2;};
const pct=(a,p)=>{const b=a.filter(Number.isFinite).sort((x,y)=>x-y);if(!b.length)return NaN;const i=(b.length-1)*p/100,lo=Math.floor(i);return b[lo]+(b[Math.ceil(i)]-b[lo])*(i-lo);};

  const mon={};for(let m=1;m<=12;m++){const g=rows.filter(r=>r.m===m);
    mon[m]={t_mean:mean(g.map(r=>r.T2M)),t_max:mean(g.map(r=>r.T2M_MAX)),t_min:mean(g.map(r=>r.T2M_MIN)),precip:sum(g.map(r=>r.PRECTOTCORR))/ny,
      eto:sum(g.map(r=>r.ETO))/ny,soil_wet:mean(g.map(r=>r.GWETROOT)),heat_days:g.filter(r=>r.T2M_MAX>35).length/ny,frost_days:g.filter(r=>r.T2M_MIN<0).length/ny};}
  const ls=[],fa=[],gdd=[],yearly={summer_tmax:[],heat_days:[],precip:[],spring_precip:[]};
  for(const y of years){const g=rows.filter(r=>r.y===y);
    const sp=g.filter(r=>r.m<7&&r.T2M_MIN<0);if(sp.length)ls.push(sp[sp.length-1].doy);
    const au=g.filter(r=>r.m>=7&&r.T2M_MIN<0);const ff=au.length?au[0].doy:365;fa.push(ff);
    gdd.push(sum(g.filter(r=>r.doy>=doyOf(y,7,1)&&r.doy<ff).map(r=>Math.max(0,r.T2M-10))));
    yearly.summer_tmax.push(mean(g.filter(r=>r.m>=6&&r.m<=8).map(r=>r.T2M_MAX)));
    yearly.heat_days.push(g.filter(r=>r.T2M_MAX>35).length);
    yearly.precip.push(sum(g.map(r=>r.PRECTOTCORR)));
    yearly.spring_precip.push(sum(g.filter(r=>r.m>=3&&r.m<=5).map(r=>r.PRECTOTCORR)));}
  return {mon,years,yearly,y1:years[0],y2:years[ny-1],
    last_spring_frost:ls.length?doyToDate(median(ls)):"—",first_autumn_frost:doyToDate(median(fa)),
    gdd_med:median(gdd),gdd_p20:pct(gdd,20),
    trends:{summer:slopeDecade(years,yearly.summer_tmax),heat:slopeDecade(years,yearly.heat_days),precip:slopeDecade(years,yearly.precip),spring:slopeDecade(years,yearly.spring_precip)},
    annual_precip:mean(yearly.precip),annual_eto:sum(Object.values(mon).map(v=>v.eto))};
}

// ======================================================================= analysis
function analyze(rot,cl){
  const n=rot.years.length,irr=Array(12).fill(0);let bare=0,nf=0,org=0,cov=0,fo=0,inc=0,heat=0,frost=0;const seen=new Set(),fam=new Set();
  rot.years.forEach((yr,yi)=>{for(let m=1;m<=12;m++){const c=yr[m];if(!c){bare++;continue;}const C=CROPS[c],M=cl.mon[m];
    irr[m-1]+=Math.max(0,M.eto*C.kc[m]-0.8*M.precip);cov+=C.cover/3;heat+=(C.heat[m]||0)*M.heat_days;frost+=(C.frost[m]||0)*M.frost_days;
    const k=yi+c;if(!seen.has(k)){seen.add(k);nf+=C.n_fix;org+=C.organic;fo+=C.forage;inc+=C.income;fam.add(C.family);}}});
  const im=irr.map(v=>v/n),warn=[];
  for(const yr of rot.years)for(const c of new Set(Object.values(yr)))if(CROPS[c].gdd&&cl.gdd_p20<CROPS[c].gdd&&!warn.includes(c))warn.push(c);
  return {irrigation:sum(im),byMonth:im,peak:im.indexOf(Math.max(...im))+1,bare:bare/n,n_fix:nf/n,
    soil:(nf+org)/n+3*cov/(12*n)+.5*fam.size,forage:fo/n,income:inc/n,heat:heat/n,frost:frost/n,families:fam.size,warn};
}
function norm(v,hb=true){const lo=Math.min(...v),hi=Math.max(...v);if(hi-lo<1e-9)return v.map(()=>70);return v.map(x=>100*(hb?(x-lo)/(hi-lo):1-(x-lo)/(hi-lo)));}
function score(res,w,waterMM){
  const c={water:norm(res.map(r=>r.irrigation),false),income:norm(res.map(r=>r.income)),soil:norm(res.map(r=>r.soil-r.bare)),forage:norm(res.map(r=>r.forage)),risk:norm(res.map(r=>r.heat+r.frost),false)};
  const ws=Object.values(w).reduce((a,b)=>a+b,0)||1;
  return res.map((r,i)=>{const short=Math.max(0,r.irrigation-waterMM);let t=Object.keys(c).reduce((a,k)=>a+c[k][i]*w[k],0)/ws;
    t=t-short/20-15*r.warn.length;return {total:Math.round(Math.max(0,Math.min(100,t))),short};});
}

const X=(k,kw={})=>{let v=TX[k][LANG]??TX[k].en;for(const[a,b]of Object.entries(kw))v=v.replaceAll("{"+a+"}",b);return v;};
function explain(rot,r,cur,cl,sc){
  const d=r.irrigation-cur.irrigation,diff=Math.abs(d)<10?X("same"):d>0?X("more",{v:fmt(d)}):X("less",{v:fmt(-d)});
  const ev=[X("ev_water",{irr:fmt(r.irrigation),diff,peak:MONTHS[LANG][r.peak-1]}),X("ev_bare",{b:fmt(r.bare,1),c:fmt(cur.bare,1)}),X("ev_heat",{h:fmt(r.heat)})];
  const ben=[],risk=[];
  if(r.n_fix>cur.n_fix)ben.push(X("b_nfix"));if(r.bare<cur.bare-.5)ben.push(X("b_cover"));if(r.forage>cur.forage)ben.push(X("b_forage"));
  if(d<-50)ben.push(X("b_water"));if(r.families>cur.families)ben.push(X("b_div"));if(rot.key==="catch_crop")ben.push(X("b_inc"));
  if(sc.short>0)risk.push(X("r_short",{v:fmt(sc.short)}));
  const crops=[...new Set(rot.years.flatMap(y=>Object.values(y)))].sort();
  for(const c of crops){const need=CROPS[c].gdd;if(need)risk.push(cl.gdd_p20<need?X("r_gdd",{crop:cname(c),need,p20:fmt(cl.gdd_p20)}):X("r_gdd_ok",{crop:cname(c),need,med:fmt(cl.gdd_med)}));}
  if(r.heat>15)risk.push(X("r_heat"));if(rot.key==="alfalfa")risk.push(X("r_alf"));
  const nc=crops.filter(c=>c!=="cotton"&&c!=="wheat").map(cname);if(nc.length)risk.push(X("r_mkt",{crops:nc.join(", ")}));
  return {why:rot.idea[LANG]??rot.idea.en,evidence:ev,benefits:ben,risks:risk,gaps:[X("g_soil"),X("g_sat"),X("g_econ")]};
}

  if(window.Plotly){

    T("t_spring",{v:fmt(tr.spring,0,true)}),T("frost_dates",{a:cl.last_spring_frost,b:cl.first_autumn_frost,y1:cl.y1,y2:cl.y2})].map(x=>`<li>${x}</li>`).join("");
  $("calendars").innerHTML=state.table.map(r=>`<p><b>${r.name}</b></p><table class="cal"><tr><th></th>${ML.map(m=>`<th>${m}</th>`).join("")}</tr>
    ${r.rot.years.map((y,i)=>`<tr><th>${T("year")} ${i+1}</th>${Array.from({length:12},(_,m)=>{const c=y[m+1];return `<td style="background:${c?CROPS[c].color:"#FDE2E4"}">${c?cname(c):""}</td>`;}).join("")}</tr>`).join("")}</table>`).join("");
  $("dataInfo").innerHTML=`<h4>NASA POWER — Prediction Of Worldwide Energy Resources</h4>
   <p>Daily, ${cl.y1}–${cl.y2}, point ${state.lat.toFixed(3)}, ${state.lon.toFixed(3)} ${state.demo?"<b>(DEMO — synthetic)</b>":""}</p>
   <ul><li><code>T2M, T2M_MAX, T2M_MIN</code> — air temperature: heat days, frost dates, heat units for second crops</li>
   <li><code>PRECTOTCORR</code> — precipitation (NASA GPM / MERRA-2 based)</li><li><code>GWETROOT</code> — root-zone soil wetness (NASA GMAO MERRA-2)</li>
   <li><code>ALLSKY_SFC_SW_DWN</code> — solar radiation (NASA CERES)</li></ul>
   <p><b>Method.</b> ETo — Hargreaves–Samani (FAO-56 eq. 52). Crop water need = ETo × Kc (monthly FAO-56); irrigation = need − 0.8 × rain.
   Trends — linear regression of yearly values. Second crop — growing degree days (base 10 °C) from 1 July to first autumn frost (median and 20th percentile).
   Score — weighted multi-criteria comparison by the farmer's own priorities, with penalty when water need exceeds what is available.</p>
   <p><b>Limitations.</b> ~0.5° grid (≈50 km); no field soil test; crop indices are expert estimates to be validated locally. Satellite/model data differ from on-farm measurements — combining both improves accuracy.</p>
   <p>Source: <a href="https://power.larc.nasa.gov" target="_blank">power.larc.nasa.gov</a> · Team Delta-177, Dushanbe</p>

// ======================================================================= NASA MODIS NDVI (ORNL DAAC)
const MODIS="https://modis.ornl.gov/rst/api/v1/MOD13Q1";
async function fetchNdvi(lat,lon){
  const ck=`fs_ndvi_${lat.toFixed(3)}_${lon.toFixed(3)}_${new Date().toISOString().slice(0,7)}`;
  try{const c=localStorage.getItem(ck);if(c)return JSON.parse(c);}catch(e){}
  const H={headers:{Accept:"application/json"}};
  const r=await fetch(`${MODIS}/dates?latitude=${lat}&longitude=${lon}`,H);if(!r.ok)throw new Error("HTTP "+r.status);
  const dates=(await r.json()).dates.slice(-46);const out=[];
  for(let i=0;i<dates.length;i+=10){const ch=dates.slice(i,i+10);
    const q=await fetch(`${MODIS}/subset?latitude=${lat}&longitude=${lon}&band=250m_16_days_NDVI&startDate=${ch[0].modis_date}&endDate=${ch[ch.length-1].modis_date}&kmAboveBelow=0&kmLeftRight=0`,H);
    if(!q.ok)throw new Error("HTTP "+q.status);
    for(const sb of (await q.json()).subset){const v=sb.data[0];if(v>-2000)out.push({date:sb.calendar_date,ndvi:v*0.0001});}}
  try{localStorage.setItem(ck,JSON.stringify(out));}catch(e){}
  return out;}
async function loadNdvi(lat,lon,my){
  $("ndviStatus").textContent=T("ndvi_load");$("ndviNote").innerHTML="";
  try{const pts=await fetchNdvi(lat,lon);if(my!==runId)return;if(!pts.length)throw new Error("no data");
    state.ndvi=pts;renderNdvi();}
  catch(e){if(my===runId){state.ndvi=null;$("ndviStatus").textContent=T("ndvi_err",{e:e.message});if(window.Plotly)Plotly.purge("chNdvi");}}}
function renderNdvi(){const pts=state.ndvi;if(!pts)return;
  $("ndviStatus").textContent=T("ndvi_ok",{n:pts.length,a:pts[0].date,b:pts[pts.length-1].date});
  if(window.Plotly)Plotly.react("chNdvi",[{x:pts.map(p=>p.date),y:pts.map(p=>+p.ndvi.toFixed(3)),mode:"lines+markers",line:{color:"#2A9D8F"},name:"NDVI"},
    {x:[pts[0].date,pts[pts.length-1].date],y:[0.2,0.2],mode:"lines",line:{color:"#D1495B",dash:"dash"},name:"0.2"}],
    {margin:{t:20,l:80,r:20,b:50},yaxis:{title:{text:T("ndvi_axis"),font:{size:12}},range:[-0.05,1]},showlegend:false},{responsive:true});
  const last=new Date(Date.parse(pts[pts.length-1].date)-365*864e5),by={};
  for(const p of pts){const d=new Date(p.date);if(d<last)continue;const m=d.getUTCMonth();(by[m]=by[m]||[]).push(p.ndvi);}
  const bare=Object.entries(by).filter(([m,v])=>mean(v)<0.2).map(([m])=>+m).sort((a,b)=>a-b).map(m=>MONTHS[LANG][m]);
  $("ndviNote").innerHTML=(bare.length?T("ndvi_bare",{m:bare.join(", ")}):T("ndvi_green"))+"<br><span class='muted'>"+T("ndvi_hint")+"</span>";}

let layersCtl,baseSat,baseStreet,overLabels,cellRect,gTrue,gNdvi,gLst;
const gibsUrl=(layer,tms,ext,date)=>`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/${layer}/default/${date}/${tms}/{z}/{y}/{x}.${ext}`;
const ndviDate=d=>new Date(Date.parse(d)-12*864e5).toISOString().slice(0,10); // 8-day composite needs a finished period
function setupLayers(){
  if(layersCtl)map.removeControl(layersCtl);
  layersCtl=L.control.layers({[T("sat")]:baseSat,[T("streets")]:baseStreet,[T("l_true")]:gTrue},{[T("l_ndvi")]:gNdvi,[T("l_lst")]:gLst,[T("labels")]:overLabels,[T("cell")]:cellRect},{position:"topright",collapsed:true}).addTo(map);
  cellRect.bindTooltip(T("cell"));}
try{
  map=L.map("map",{zoomControl:true}).setView([38.6,69.2],7);
  baseSat=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Imagery © Esri, Maxar, Earthstar Geographics"});
  baseStreet=L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"});
  overLabels=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",{maxZoom:19});
  baseSat.addTo(map);overLabels.addTo(map);
  const d0=new Date(Date.now()-3*864e5).toISOString().slice(0,10);$("gibsDate").value=d0;$("gibsDate").max=new Date().toISOString().slice(0,10);
  gTrue=L.tileLayer(gibsUrl("MODIS_Terra_CorrectedReflectance_TrueColor","GoogleMapsCompatible_Level9","jpg",d0),{maxZoom:19,maxNativeZoom:9,attribution:"NASA GIBS / EOSDIS"});
  gNdvi=L.tileLayer(gibsUrl("MODIS_Terra_NDVI_8Day","GoogleMapsCompatible_Level9","png",ndviDate(d0)),{maxZoom:19,maxNativeZoom:9,opacity:.75,attribution:"NASA GIBS / EOSDIS"});
  gLst=L.tileLayer(gibsUrl("MODIS_Terra_Land_Surface_Temp_Day","GoogleMapsCompatible_Level7","png",d0),{maxZoom:19,maxNativeZoom:7,opacity:.7,attribution:"NASA GIBS / EOSDIS"});
  $("gibsDate").onchange=()=>{const d=$("gibsDate").value;if(!d)return;
    gTrue.setUrl(gibsUrl("MODIS_Terra_CorrectedReflectance_TrueColor","GoogleMapsCompatible_Level9","jpg",d));
    gNdvi.setUrl(gibsUrl("MODIS_Terra_NDVI_8Day","GoogleMapsCompatible_Level9","png",ndviDate(d)));
    gLst.setUrl(gibsUrl("MODIS_Terra_Land_Surface_Temp_Day","GoogleMapsCompatible_Level7","png",d));
    if(!map.hasLayer(gTrue)&&!map.hasLayer(gNdvi)&&!map.hasLayer(gLst))gNdvi.addTo(map);};
  L.control.scale({metric:true,imperial:false}).addTo(map);
  cellRect=L.rectangle([[0,0],[0.1,0.1]],{color:"#ffd166",weight:2,fill:true,fillOpacity:.06,dashArray:"6 6"}).addTo(map);
  marker=L.marker([0,0],{icon:L.divIcon({className:"",html:'<div class="pin"></div>',iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-26]}),draggable:true}).addTo(map);
  marker.on("dragend",()=>{const p=marker.getLatLng();$("place").value="custom";setPoint(p.lat,p.lng,true);autoRun();});
  map.on("click",e=>{$("place").value="custom";setPoint(e.latlng.lat,e.latlng.lng,true);autoRun();});
  setupLayers();
}catch(e){map=null;$("mapcard").style.display="none";}

$("locBtn").onclick=()=>{if(!navigator.geolocation){status(T("geoerr",{e:"n/a"}),"warn");return;}
